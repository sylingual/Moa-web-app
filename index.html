<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
  <title>모아 - Korean Learning</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🇰🇷</text></svg>" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root { height: 100%; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #f0f0f3;
    }
    /* Mobile: lock the page so only inner panes scroll, and follow the
       visible viewport so the on-screen keyboard shrinks the app. */
    @media (max-width: 699px) {
      html, body {
        height: var(--app-h, 100dvh);
        overflow: hidden;
        position: fixed;
        width: 100%;
      }
      #root { height: var(--app-h, 100dvh); }
    }
    @media (min-width: 700px) {
      body { display: flex; align-items: center; justify-content: center; padding: 20px; }
      #root {
        width: 100%; max-width: 1100px; height: 88vh; min-height: 550px;
        border-radius: 14px; overflow: hidden;
        box-shadow: 0 8px 40px rgba(0,0,0,0.08), 0 1px 3px rgba(0,0,0,0.06);
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
